name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # No dependencies and no models, so the matrix is free. Running it proves the
    # zero-dependency claim rather than asserting it.
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest ruff
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pip install -e .
      - run: pytest -q
